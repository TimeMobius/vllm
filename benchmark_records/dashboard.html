<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWKV7 vLLM-SP 性能演进</title>
<style>
:root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
body { margin: 0; background: #10131a; color: #ecf2ff; }
main { max-width: 1120px; margin: 0 auto; padding: 32px 20px 48px; }
h1 { margin: 0 0 8px; font-size: 28px; }
p { color: #aebbd0; }
.card { background: #171c27; border: 1px solid #2b3548; border-radius: 12px; padding: 20px; margin-top: 18px; }
#chart { width: 100%; min-height: 360px; display: block; background: #101722; border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 10px; border-bottom: 1px solid #2b3548; text-align: left; vertical-align: top; }
th { color: #93a8ca; font-weight: 600; }
.up { color: #55e6a5; font-weight: 700; } .bad { color: #ff8694; font-weight: 700; }
code { color: #97d8ff; } .muted { color: #93a8ca; font-size: 13px; }
.empty { color: #ffcf70; }
</style>
</head>
<body><main>
<h1>RWKV7 vLLM-SP 性能演进</h1>
<p>每一个数据点来自保留的 JSON 测试记录。折线图只包含通过精度门禁的保留优化；被拒绝候选以红色表格行保留，方便回溯。不同 GPU、模型或负载不得直接横向比较。</p>
<div class="card"><svg id="chart" viewBox="0 0 1000 380" role="img" aria-label="算法 TPS 折线图"></svg></div>
<div class="card"><h2>已记录的算法</h2><div id="table"></div></div>
<div class="card muted"><strong>数据位置：</strong><code>benchmark_records/performance_history.jsonl</code>。重新生成：<code>/mnt/data/anaconda3/envs/vllm-sp/bin/python tools/rwkv7_perf_dashboard.py</code></div>
</main>
<script>
const records = [{"record_path": "20260820_cached_fp32_params/comparison.json", "algorithm_id": "cached-fp32-params", "parent_id": "recurrent-t1-fused", "status": "verified", "baseline_tps": 133.77456980907579, "tps": 137.9719603056634, "speedup_percent": 3.137659498795742, "prompt_tokens": "mixed fixed prompts", "output_tokens_per_round": 256, "gpu": "NVIDIA GeForce RTX 4090 D sm89", "accuracy_record": "benchmark_records/20260820_cached_fp32_params/accuracy.json", "notes": "Same RTX 4090 D service and retained eager flags (mix6 shape dispatch, fused kk-pre, fused lnx/rkvres/xg, fused cmix, direct linear, alternate recurrent plus fused T=1). Eight fixed prompts at concurrency=8, max_tokens=32, ignore_eos=true; five rounds after one warmup. The opt-in FP32 constant cache removes repeated BF16-to-FP32 casts of k_k, k_a and r_k during each attention decode."}, {"record_path": "20260820_cuda_graph_rejected/comparison.json", "algorithm_id": "20260820_cuda_graph_rejected", "parent_id": "eager-t1-reference", "status": "rejected", "baseline_tps": 134.72668601291633, "tps": 132.69199097071407, "speedup_percent": -1.5102390642988017, "prompt_tokens": "see record", "output_tokens_per_round": "see record", "gpu": "NVIDIA GeForce RTX 4090 D sm89", "accuracy_record": "benchmark_records/20260820_cuda_graph_rejected/accuracy.json", "notes": "Reject and do not recommend CUDA graph modes: piecewise is -1.51% versus eager T1 and has 28/256 token mismatches; full variants are faster but have 248/256 token mismatches. Likely recurrent state/cache handoff or padded slot replay issue. Keep enforce-eager + fused T1 only."}, {"record_path": "20260820_mix6_comparison.json", "algorithm_id": "mix6-shape-dispatch", "parent_id": "baseline-current-flags", "status": "verified", "baseline_tps": 139.17264795453448, "tps": 142.78772013556025, "speedup_percent": 2.5975450163215674, "prompt_tokens": 209, "output_tokens_per_round": 512, "gpu": "NVIDIA GeForce RTX 4090 D sm89", "accuracy_record": "benchmark_records/20260820_mix6_output_compare.json", "notes": "Fixed prompt, 8 concurrent requests, 64 max tokens, ignore_eos=true; three warmup requests before measurement."}, {"record_path": "20260820_recurrent_t1_cache_rejected/comparison.json", "algorithm_id": "20260820_recurrent_t1_cache_rejected", "parent_id": "eager-t1-reference", "status": "rejected", "baseline_tps": 130.49852307926326, "tps": 91.95388996945574, "speedup_percent": -29.536451601368675, "prompt_tokens": "8 fixed prompts, concurrency=8, 32 output tokens, 5 measured rounds after warmup; --enforce-eager --mamba-cache-mode align", "output_tokens_per_round": "see record", "gpu": "NVIDIA GeForce RTX 4090 D sm89", "accuracy_record": {"reference": "/tmp/rwkv7_t1_seed_ids.json", "candidate_artifact": "cache_on_seed_ids.json", "mismatched_tokens_per_prompt": [0, 25, 0, 28, 0, 0, 0, 2], "mismatched_tokens_total": 55, "exact_match_prompts": 5, "total_tokens": 256}, "notes": "Rejected and reverted. Direct cache update regressed service TPS by -29.54% and violated deterministic token parity. Do not enable RWKV7_USE_FUSED_RECURRENT_T1_CACHE; cache row ownership / decode state indexing requires a smaller, isolated reproduction before another attempt."}, {"record_path": "20260820_recurrent_t1_comparison.json", "algorithm_id": "recurrent-t1-fused", "parent_id": "mix6-shape-dispatch", "status": "verified", "baseline_tps": 130.76647162009667, "tps": 134.72668601291633, "speedup_percent": 3.028463140249671, "prompt_tokens": "mixed fixed prompts", "output_tokens_per_round": 256, "gpu": "NVIDIA GeForce RTX 4090 D sm89", "accuracy_record": "benchmark_records/20260820_recurrent_t1_accuracy.json", "notes": "Same model/flags, 8 fixed prompts, concurrency=8, 32 output tokens, 5 measured rounds after one warmup. T=1 Triton matrix kernel is opt-in via RWKV7_USE_FUSED_RECURRENT_T1=1."}, {"record_path": "20260820_shift_mix6_native_rejected/comparison.json", "algorithm_id": "20260820_shift_mix6_native_rejected", "parent_id": "eager-t1-reference", "status": "rejected", "baseline_tps": 137.9719603056634, "tps": 132.48451605697403, "speedup_percent": -3.977970626421677, "prompt_tokens": "8 fixed prompts, concurrency=8, 32 output tokens, five measured rounds after one warmup; --enforce-eager --mamba-cache-mode align", "output_tokens_per_round": "see record", "gpu": "NVIDIA GeForce RTX 4090 D sm89", "accuracy_record": {"operator": "operator_accuracy.json; exact max_abs_error=0.0 for T=1/8/257/1024 with no cache, [hidden] cache, and [tokens, hidden] batch cache", "service": "candidate_serial_ids.json and candidate_serial_ids_repeat.json; 3 repeated serial runs matched retained token IDs for 8 prompts x 32 tokens"}, "notes": "Rejected and reverted: native BF16 fusion passed exact operator and serial token parity, but real service throughput regressed 3.98% (additional run -4.17%). The isolated kernel gain did not survive the full RWKV7 decode pipeline."}, {"record_path": "20260820_t1_epilogue_rejected/comparison.json", "algorithm_id": "t1-epilogue-fusion", "parent_id": "eager-t1-reference", "status": "rejected", "baseline_tps": 137.9719603056634, "tps": 140.17643251781428, "speedup_percent": 1.5977682764433343, "prompt_tokens": "8 fixed prompts, concurrency=8, 32 output tokens, five measured rounds after warmup", "output_tokens_per_round": "see record", "gpu": "NVIDIA GeForce RTX 4090 D sm89", "accuracy_record": {"reference_record": "benchmark_records/20260820_cached_fp32_params/cache_on_serial_ids.json", "candidate_record": "candidate_serial_ids.json", "mismatched_tokens_per_prompt": [0, 25, 0, 21, 0, 0, 0, 2], "mismatched_tokens_total": 48, "exact_match_prompts": 5, "total_prompts": 8, "candidate_repeat_mismatch_count": 0}, "notes": "Rejected and reverted: the fused T=1 recurrent + lnx/rkvres/xg epilogue reduced the isolated two-kernel path substantially for B=1-32, but service output diverged by 48/256 token IDs against the retained cache-on path. The candidate was deterministic when repeated under its own configuration, so the divergence is numerical path sensitivity rather than runtime instability."}];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chart = document.getElementById('chart');
const table = document.getElementById('table');
if (!records.length) {
  chart.outerHTML = '<p class="empty">尚无 *_comparison.json 记录。</p>';
  table.innerHTML = '<p class="empty">请先完成基线与优化后的 A/B 测试。</p>';
} else {
  const verified = records.filter(r => r.status === 'verified');
  const points = verified.length ? [{algorithm_id: 'baseline-current-flags', tps: verified[0].baseline_tps, uplift: 0, notes: 'comparison baseline'}, ...verified.map(r => ({algorithm_id:r.algorithm_id,tps:r.tps,uplift:r.speedup_percent,notes:r.notes}))] : [];
  if (!points.length) {
    chart.outerHTML = '<p class="empty">尚无通过精度门禁的 *_comparison.json 记录。</p>';
  } else {
  const W=1000,H=380,L=72,R=30,T=30,B=68;
  const min=Math.min(...points.map(p=>p.tps))*0.94, max=Math.max(...points.map(p=>p.tps))*1.06;
  const sx=i=>L+(W-L-R)*(points.length===1?.5:i/(points.length-1));
  const sy=v=>H-B-(v-min)/(max-min||1)*(H-T-B);
  let svg='';
  for(let i=0;i<5;i++){ const v=min+(max-min)*i/4, y=sy(v); svg+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#29364c"/><text x="${L-10}" y="${y+5}" fill="#93a8ca" text-anchor="end" font-size="13">${v.toFixed(1)}</text>`; }
  svg += `<path d="${points.map((p,i)=>`${i?'L':'M'} ${sx(i)} ${sy(p.tps)}`).join(' ')}" fill="none" stroke="#6ca8ff" stroke-width="3"/>`;
  points.forEach((p,i)=>{const x=sx(i),y=sy(p.tps);svg+=`<circle cx="${x}" cy="${y}" r="6" fill="#55e6a5"/><text x="${x}" y="${H-B+22}" fill="#dce7fa" text-anchor="middle" font-size="12">${esc(p.algorithm_id)}</text><text x="${x}" y="${y-12}" fill="#55e6a5" text-anchor="middle" font-size="13">${p.tps.toFixed(2)} TPS</text>`;});
  svg += `<text x="${L}" y="20" fill="#93a8ca" font-size="13">Aggregate TPS（固定负载）</text>`;
  chart.innerHTML=svg;
  }
  table.innerHTML=`<table><thead><tr><th>状态 / 算法</th><th>TPS</th><th>相对基线</th><th>精度</th><th>负载</th><th>说明 / 原始记录</th></tr></thead><tbody>${records.map(r=>`<tr><td class="${r.status === 'verified' ? 'up':'bad'}">${r.status === 'verified' ? '已保留':'已回退'}<br><code>${esc(r.algorithm_id)}</code><div class="muted">parent: ${esc(r.parent_id)}</div></td><td>${r.tps.toFixed(3)}</td><td class="${r.speedup_percent >= 0 && r.status === 'verified' ? 'up':'bad'}">${r.speedup_percent >= 0 ? '+':''}${r.speedup_percent.toFixed(2)}%</td><td><code>${esc(typeof r.accuracy_record === 'string' ? r.accuracy_record : JSON.stringify(r.accuracy_record))}</code></td><td>${esc(r.prompt_tokens)} × ${esc(r.output_tokens_per_round)}<br><span class="muted">${esc(r.gpu)}</span></td><td>${esc(r.notes)}<div class="muted"><code>${esc(r.record_path)}</code></div></td></tr>`).join('')}</tbody></table>`;
}
</script></body></html>
